# Builds FontCraft's packages with Rust on GitHub's own machines (GitHub Actions), for every system,
# Intel/AMD (x64) and ARM:
#   - macOS 12 Monterey+: universal app (Intel + Apple silicon) in a .zip
#   - Windows 10 22H2 / 11, x64 and ARM64: installer (Inno Setup) + portable .zip
#   - Linux x64 and ARM64 (and ARMv7, 32-bit): .deb, .rpm and .tar.gz, built on Ubuntu 22.04 so
#     they run on distributions from 2022 onwards
#   - Android 12+ (ARM64 phones and tablets, x86_64): one .apk
# Runs when started by hand (Actions › FontCraft binaries › Run workflow) or when a tag "v*" is
# pushed (for example v0.1.0); with a tag the files are also published in a GitHub Release, with
# SHA256SUMS.txt. Each run's files stay under the run's "Artifacts" for 30 days.
# This file sits in the repository's root folder (the app folder is the repository).
name: FontCraft binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Universal app
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create target/x86_64-apple-darwin/release/FontCraft target/aarch64-apple-darwin/release/FontCraft -output target/fontcraft-universal
          sh packaging/macos/make-app.sh target/fontcraft-universal
      - uses: actions/upload-artifact@v5
        with:
          name: fontcraft-macos-universal
          path: dist/*.zip
          retention-days: 30

  windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # Both on an x64 machine: Visual Studio there also builds for ARM64, so ARM64 doesn't wait
        # for an ARM runner (those aren't offered to every repository).
        arch: [x64, arm64]
    runs-on: windows-latest
    env:
      FONTCRAFT_VERSION: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Test
        if: matrix.arch == 'x64'
        run: cargo test --release
      - name: Build, portable and installer
        shell: cmd
        run: echo.| compilar-windows.bat ${{ matrix.arch }}
      - uses: actions/upload-artifact@v5
        with:
          name: fontcraft-windows-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          retention-days: 30

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Test
        run: cargo test --release
      - name: Build and package
        run: sh compilar-linux.sh
      - uses: actions/upload-artifact@v5
        with:
          name: fontcraft-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          retention-days: 30

  linux-armv7:
    # 32-bit ARM (Raspberry Pi with a 32-bit system), cross-compiled on Ubuntu 22.04 x64 with the
    # ARM compiler and Ubuntu's own armhf libraries (no Docker). A failure here doesn't hold back
    # the other packages or the release.
    needs: version
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      FONTCRAFT_NO_CROSS: "1"
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
      PKG_CONFIG_SYSROOT_DIR: /
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
      AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      - uses: actions/checkout@v5
      - name: ARM compiler and armhf libraries
        run: |
          # The machine's package sources stay for x64; Ubuntu's ARM mirror (ports) gives armhf.
          sudo dpkg --add-architecture armhf
          sudo sed -i -E 's/^deb (http|mirror)/deb [arch=amd64] \1/' /etc/apt/sources.list
          for f in /etc/apt/sources.list.d/*.list; do [ -f "$f" ] && sudo sed -i -E 's/^deb (http|https)/deb [arch=amd64] \1/' "$f"; done
          printf 'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main universe\ndeb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe\ndeb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe\n' | sudo tee /etc/apt/sources.list.d/armhf.list
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf pkg-config libgtk-3-dev:armhf libxdo-dev:armhf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build and package
        run: sh compilar-linux.sh armhf
      - uses: actions/upload-artifact@v5
        with:
          name: fontcraft-linux-armv7
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          retention-days: 30

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK and NDK
        # The SDK comes installed on GitHub's Ubuntu machines (ANDROID_HOME); its own sdkmanager
        # adds what is missing.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-apk
      - name: Build the .apk
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: sh compilar-android.sh
      - uses: actions/upload-artifact@v5
        with:
          name: fontcraft-android
          path: dist/*.apk
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, linux-armv7, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
