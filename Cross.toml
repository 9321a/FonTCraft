[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:edge"
pre-build = [
    "dpkg --add-architecture amd64 && apt-get update",
    "apt-get install --no-install-recommends -y pkg-config libatk1.0-dev libgtk-3-dev libgdk-pixbuf2.0-dev libxdo-dev libx11-dev"
]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge"
pre-build = [
    "dpkg --add-architecture arm64 && apt-get update",
    "apt-get install --no-install-recommends -y pkg-config libatk1.0-dev:arm64 libgtk-3-dev:arm64 libgdk-pixbuf2.0-dev:arm64 libxdo-dev:arm64 libx11-dev:arm64"
]

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:edge"
pre-build = [
    "dpkg --add-architecture armhf && apt-get update",
    "apt-get install --no-install-recommends -y pkg-config libatk1.0-dev:armhf libgtk-3-dev:armhf libgdk-pixbuf2.0-dev:armhf libxdo-dev:armhf libx11-dev:armhf"
]
